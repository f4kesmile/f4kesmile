name: Daily Green Activity

on:
  schedule:
    # Run every day at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Make Empty Commit
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git commit --allow-empty -m "dataset: daily contribution update"
          git push
