name: Cyberpunk Metrics
on:
  # Schedule daily updates
  schedule: [{ cron: "0 0 * * *" }]
  # (optional) Run workflow manually
  workflow_dispatch:
  # (optional) Run on each push on the master branch
  push: { branches: ["master", "main"] }

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🌌 Cyberpunk Stats (3D + Neon)
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.cyberpunk.svg
          token: ${{ secrets.GITHUB_TOKEN }}

          # Options
          user: f4kesmile
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Jakarta
          config_display: large

          # Theme: Night Owl / Radical (Neon)

          # 3D Calendar (The "Cool" part)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Habits (Animated Charts)
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          # Stargazers (World Map)
          plugin_stargazers: yes
          plugin_stargazers_charts_type: classic

          # Languages (Detailed)
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
