name: Cyberpunk Dashboard
on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:
  push: { branches: ["master", "main"] }

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 1. LEFT PANEL: Personal & Habits
      - name: 🧩 1. Personal Cockpit
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.personal.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          base: header, activity, community, repositories
          config_timezone: Asia/Jakarta
          config_padding: 0, 8 + 6%
          config_display: large

          plugin_habits: yes
          plugin_habits_from: 50
          plugin_habits_days: 14
          plugin_habits_charts: yes

          plugin_stargazers: yes
          plugin_stargazers_charts_type: classic

      # 2. RIGHT PANEL: Tech & Code
      - name: 💾 2. Tech Data
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.tech.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ""
          config_timezone: Asia/Jakarta
          config_padding: 0, 8 + 6%

          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used

          plugin_lines: yes

          plugin_traffic: yes

      # 3. BOTTOM PANEL: Achievements & Calendar
      - name: 🏆 3. Achievements & Time
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.bottom.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ""
          config_timezone: Asia/Jakarta

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_achievements: yes
          plugin_achievements_display: compact
